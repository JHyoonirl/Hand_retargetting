# Official wuji-retargeting configuration for MANUS left-hand input.
# The node supplies the bundled Wuji Hand URDF automatically.
optimizer:
  type: "AdaptiveOptimizerAnalytical"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  # Avoid equivalent S-shaped IK solutions for an extended finger: without
  # these terms one flex joint can hit its negative limit while the next joint
  # bends forward to reach the same fingertip position.
  w_hyper: 2.0
  soft_min: 0.0
  w_couple: 0.5
  couple_ratio: 0.7
  segment_scaling:
    thumb:  [0.98, 1.0, 1.0]
    index:  [1.1, 0.989, 1.03]
    middle: [1.10, 0.96, 0.96]
    ring:   [1.1, 0.97, 0.99]
    pinky:  [1.105, 1.15, 1.15]
  mediapipe_rotation: {x: 0.0, y: 0.0, z: 15.0}
  lp_alpha: 0.3
