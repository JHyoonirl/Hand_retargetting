services:
  manus:
    build:
      context: .
      dockerfile: Dockerfile.manus
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: hand-retargetting:manus-${ROS_DISTRO:-jazzy}
    container_name: manus-retargetting

    # The MANUS Sensor Dongle is exposed as USB vendor/product 3325:0049 and
    # currently uses /dev/bus/usb. Pass only that USB bus into the container.
    # The host udev rule must be installed before the dongle is connected.
    network_mode: host
    init: true
    group_add:
      - "46" # plugdev on the Ubuntu host
    device_cgroup_rules:
      - "c 189:* rmw" # USB bus character devices only
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      - manus_config:/var/lib/manus
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      XDG_CONFIG_HOME: /var/lib/manus
    restart: "no"
    command:
      - ros2
      - run
      - manus_ros2
      - manus_data_publisher
      - --ros-args
      - -p
      - connection_attempts:=5
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /bin/bash -lc
          'source /opt/ros/$${ROS_DISTRO}/setup.bash &&
          source /work/ros2_ws/install/setup.bash &&
          (ros2 topic info /manus_glove_0 >/dev/null 2>&1 ||
           ros2 topic info /manus_glove_1 >/dev/null 2>&1)'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  manus_config:
